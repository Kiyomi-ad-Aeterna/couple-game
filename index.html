<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>纪念物消除小游戏</title>
    <style>
        body { text-align: center; font-family: sans-serif; background-color: #f0f2f5; margin-top: 50px; }
        h1 { color: #333; }
        #game-board { display: grid; grid-template-columns: repeat(3, 100px); gap: 10px; justify-content: center; margin: 20px auto; }
        .tile { width: 100px; height: 100px; background: #fff; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); cursor: pointer; display: flex; align-items: center; justify-content: center; overflow: hidden; font-size: 24px; }
        .tile img { width: 100%; height: 100%; object-fit: cover; }
        #score { font-size: 20px; color: #e74c3c; font-weight: bold; }
    </style>
</head>
<body>

    <h1>😂 寻找你的纪念物！</h1>
    <p>点击相同的纪念物进行消除，获得积分！</p>
    <div id="score">得分: 0</div>
    <div id="game-board"></div>

    <script>
        const images = [
            'images/friend1.jpg',
            'images/friend2.jpg',
            'images/friend3.jpg'
        ];

        let score = 0;
        const board = document.getElementById('game-board');
        const scoreDisplay = document.getElementById('score');

        function initGame() {
            board.innerHTML = '';
            for (let i = 0; i < 9; i++) {
                const randomImg = images[Math.floor(Math.random() * images.length)];
                const tile = document.createElement('div');
                tile.className = 'tile';
                
                const img = document.createElement('img');
                img.src = randomImg;
                tile.appendChild(img);

                tile.onclick = function() {
                    score += 10;
                    scoreDisplay.innerText = "得分: " + score;
                    img.src = images[Math.floor(Math.random() * images.length)];
                };

                board.appendChild(tile);
            }
        }

        initGame();
    </script>

</body>
</html>
